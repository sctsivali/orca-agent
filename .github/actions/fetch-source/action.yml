name: Fetch private agent source
description: Fetch the exact approved private source commit into an ephemeral runner
inputs:
  token:
    description: GitLab read-only token with read_repository scope
    required: true
  ref:
    description: Exact 40-character GitLab source commit SHA
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GITLAB_TOKEN: ${{ inputs.token }}
        REF: ${{ inputs.ref }}
      run: |
        set -euo pipefail
        umask 077
        [[ "$REF" =~ ^[a-fA-F0-9]{40}$ ]] || { echo "An exact source commit SHA is required" >&2; exit 1; }
        GITLAB_TOKEN="$(printf '%s' "$GITLAB_TOKEN" | tr -d '[:space:]')"
        [[ -n "$GITLAB_TOKEN" ]] || { echo "GitLab read credential is unavailable" >&2; exit 1; }
        echo "::add-mask::$GITLAB_TOKEN"
        ASKPASS_FILE="$(mktemp "$RUNNER_TEMP/orca-agent-git-askpass.XXXXXX")"
        trap 'rm -f "$ASKPASS_FILE"' EXIT
        cat >"$ASKPASS_FILE" <<'ASKPASS'
        #!/usr/bin/env bash
        case "$1" in
          *Username*) printf '%s\n' oauth2 ;;
          *Password*) printf '%s\n' "$GITLAB_TOKEN" ;;
          *) exit 1 ;;
        esac
        ASKPASS
        chmod 700 "$ASKPASS_FILE"
        export GIT_ASKPASS="$ASKPASS_FILE" GIT_TERMINAL_PROMPT=0 GITLAB_TOKEN
        [[ ! -e src ]] || { echo "Source workspace already exists" >&2; exit 1; }
        mkdir src
        git -C src init -q
        git -C src remote add origin https://dev.sivali.co/research-and-dev/orcahub.git
        git -C src sparse-checkout init --no-cone
        git -C src sparse-checkout set --no-cone '/orca-agent/' '/backend/src/services/agent-installer-script.ts'
        git -C src fetch -q --depth 1 origin "$REF"
        git -C src checkout -q FETCH_HEAD
        ACTUAL="$(git -C src rev-parse HEAD)"
        [[ "$ACTUAL" == "${REF,,}" ]] || { echo "Fetched commit differs from the approved source" >&2; exit 1; }
        echo "Fetched exact approved source commit $ACTUAL"
